name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.8.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史用于生成 changelog

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-home-cache-cleanup: true

      # ========== 确定版本号 ==========
      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # 从 tag 提取版本号 (v1.8.0 -> 1.8.0)
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 计算 versionCode: 1.8.0 -> 10800
          IFS='.' read -r major minor patch <<< "$VERSION"
          CODE=$((major * 10000 + minor * 100 + patch))
          echo "versionCode=$CODE" >> $GITHUB_OUTPUT
          echo "📋 Version: $VERSION (code: $CODE)"

      # ========== 签名配置 ==========
      - name: Decode keystore (if available)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️ No keystore found, will build unsigned"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # 如果有签名配置，构建 release；否则构建 debug
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            ./gradlew assembleRelease \
              -PversionName=${{ steps.version.outputs.version }} \
              -PversionCode=${{ steps.version.outputs.versionCode }}
          else
            ./gradlew assembleDebug \
              -PversionName=${{ steps.version.outputs.version }} \
              -PversionCode=${{ steps.version.outputs.versionCode }}
            # 把 debug apk 重命名为 release 格式，方便上传
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/SWUpdater-v${{ steps.version.outputs.version }}.apk
          fi

      # ========== 生成更新日志 ==========
      - name: Generate Changelog
        id: changelog
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          CURRENT_TAG=$(git tag --sort=-version:refname | head -1)

          echo "📌 Previous tag: ${PREV_TAG:-none}"
          echo "📌 Current tag: $CURRENT_TAG"

          # 获取两个 tag 之间的 commit
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..${CURRENT_TAG} --pretty=format:"%s" 2>/dev/null || echo "")
          else
            COMMITS=$(git log --pretty=format:"%s" -50 2>/dev/null || echo "")
          fi

          # 分类 commit 生成 changelog
          {
            echo "CHANGELOG<<EOF"

            # 新功能
            FEATS=$(echo "$COMMITS" | grep -iE "^[^:]+:.*feat" || true)
            if [ -n "$FEATS" ]; then
              echo "## 🚀 新功能"
              echo "$FEATS" | while read -r line; do
                msg=$(echo "$line" | sed 's/^[^:]*: //' | sed 's/^feat: //')
                echo "- $msg"
              done
              echo ""
            fi

            # 修复
            FIXES=$(echo "$COMMITS" | grep -iE "^[^:]+:.*fix" || true)
            if [ -n "$FIXES" ]; then
              echo "## 🐛 修复"
              echo "$FIXES" | while read -r line; do
                msg=$(echo "$line" | sed 's/^[^:]*: //' | sed 's/^fix: //')
                echo "- $msg"
              done
              echo ""
            fi

            # 优化
            REFACTORS=$(echo "$COMMITS" | grep -iE "^[^:]+:.*(refactor|perf|improve|optim)" || true)
            if [ -n "$REFACTORS" ]; then
              echo "## 🔧 优化"
              echo "$REFACTORS" | while read -r line; do
                msg=$(echo "$line" | sed 's/^[^:]*: //' | sed -E 's/^(refactor|perf|improve|optim): //')
                echo "- $msg"
              done
              echo ""
            fi

            # 其他所有 commit
            OTHER=$(echo "$COMMITS" | grep -viE "^[^:]+:.*(feat|fix|refactor|perf|improve|optim)" || true)
            if [ -n "$OTHER" ]; then
              echo "## 📝 其他更新"
              echo "$OTHER" | while read -r line; do
                echo "- $line"
              done
              echo ""
            fi

            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "📋 Changelog generated"

      # ========== 创建 GitHub Release ==========
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: "魔灵召唤·自动更新 v${{ steps.version.outputs.version }}"
          body: |
            # 魔灵召唤·自动更新 v${{ steps.version.outputs.version }}

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            📦 **安装说明**
            1. 下载下方 APK 文件
            2. 在手机上打开安装（需开启「安装未知应用」权限）
            3. 安装完成即可使用

            ⚠️ **注意事项**
            - 首次安装需授予存储权限和网络权限
            - 建议在 WiFi 环境下自动下载更新包
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ========== 清理 keystore ==========
      - name: Cleanup keystore
        if: always()
        run: |
          rm -f app/release.jks
          echo "🧹 Keystore cleaned up"
